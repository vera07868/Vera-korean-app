<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>韓文背單字 SRS</title>
  <style>
    :root {
      --bg: #050505;
      --card: #0f172a;
      --card-soft: #111827;
      --primary: #6366f1;
      --primary-dark: #818cf8;
      --danger: #ef4444;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --border: #334155;
      --ok: #22c55e;
      --warn: #f59e0b;
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #050505;
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
    }
    .speed-pill-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid var(--primary);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #c7d2fe;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }
    .speed-select {
      height: 32px !important;
      padding: 2px 10px !important;
      border-radius: 999px !important;
      background: #020617 !important;
      border: 1px solid #4338ca !important;
      color: #fff !important;
      font-size: 14px !important;
      font-weight: 800;
      cursor: pointer;
      width: auto !important;
    }

    h2, h3 { margin-top: 0; }
    .card, details.card {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 22px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .two-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .actions, .filters, .modes, .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      background: #334155;
      color: #f8fafc;
      transition: 0.18s ease;
      font-weight: 650;
    }
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    button:active { transform: translateY(0); }
    .primary { background: var(--primary); color: white; }
    .primary:hover { background: #4f46e5; }
    .danger { background: var(--danger); color: white; }
    .ghost { background: #1e293b; color: #c7d2fe; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 12px;
      background: #020617;
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    select {
      height: 48px;
      line-height: 1.2;
      appearance: auto;
      -webkit-appearance: menulist;
      overflow: hidden;
    }
    select option {
      color: #f8fafc;
      background: #020617;
      font-size: 16px;
    }
    input::placeholder, textarea::placeholder {
      color: #94a3b8;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    label .field-title {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
      color: #e2e8f0;
    }
    .muted {
      color: var(--muted);
      font-size: 14px;
    }
    .hidden { display: none !important; }
    .duplicate-alert {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid #f59e0b;
      border-radius: 16px;
      background: #451a03;
      color: #fffbeb;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .duplicate-alert strong {
      display: block;
      margin-bottom: 4px;
      color: #fde68a;
      font-size: 16px;
    }
    .duplicate-alert p {
      margin: 0;
      color: #fef3c7;
      font-size: 14px;
      line-height: 1.55;
    }
    .duplicate-alert .duplicate-actions {
      flex: 0 0 auto;
      justify-content: flex-end;
    }
    .modes { margin: 12px 0; }
    .modes label {
      width: auto;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
    }
    .modes input {
      width: auto;
      margin-right: 6px;
    }
    .progress {
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #06b6d4);
      transition: width 0.25s ease;
    }
    .quiz-panel {
      display: grid;
      gap: 14px;
      text-align: center;
      margin-top: 14px;
    }
    .question-card {
      border-radius: 20px;
      border: 1px dashed #6366f1;
      background: #020617;
      padding: 26px 18px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      background: #1e293b;
      color: #c7d2fe;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      margin: 0 4px 12px;
    }
    .badge.category {
      background: #064e3b;
      color: #a7f3d0;
    }
    .question-text {
      font-size: clamp(30px, 6vw, 58px);
      line-height: 1.2;
      font-weight: 800;
      word-break: keep-all;
    }
    .answer-input {
      width: min(100%, 520px);
      text-align: center;
      font-size: 22px;
      margin: 0 auto;
    }
    .mc-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: min(100%, 600px);
      margin: 0 auto;
    }
    .mc-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s ease;
    }
    .mc-btn:hover {
      background: #334155;
      border-color: var(--primary);
    }
    .mc-btn.correct {
      background: #052e16 !important;
      border-color: var(--ok) !important;
      color: #86efac !important;
    }
    .mc-btn.wrong {
      background: #451a03 !important;
      border-color: var(--danger) !important;
      color: #fecaca !important;
    }
    .result {
      min-height: 30px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }
    .result.ok { color: var(--ok); }
    .result.bad { color: var(--danger); }
    details.card {
      padding: 0;
      overflow: hidden;
    }
    details.card > summary {
      list-style: none;
      cursor: pointer;
      padding: 20px 22px;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card[open] > summary {
      border-bottom: 1px solid var(--border);
    }
    .content { padding: 22px; }
    .words {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .word {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #020617;
      padding: 14px;
    }
    .word-line, .example-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .word-line {
      margin-bottom: 2px;
    }
    .example-line {
      align-items: flex-start;
    }
    .ko {
      font-size: 24px;
      font-weight: 800;
    }
    .zh, .tag { color: var(--muted); }
    .tag { font-size: 13px; }
    .icon-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      background: #1e293b;
      color: #c7d2fe;
      font-size: 15px;
    }
    .voice-tag-group {
      display: inline-flex;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      margin-left: 8px;
    }
    .voice-tag-btn {
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      background: transparent;
      color: #94a3b8;
    }
    .voice-tag-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .flag-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      font-size: 16px;
      opacity: 0.85;
    }
    .flag-btn.active.favorite {
      background: #713f12;
      color: #fde68a;
      border-color: #f59e0b;
      opacity: 1;
    }
    .flag-btn.active.important {
      background: #7f1d1d;
      color: #fecaca;
      border-color: #ef4444;
      opacity: 1;
    }
    .quiz-flags {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .accuracy-box {
      margin-top: 9px;
      max-width: 260px;
    }
    .accuracy-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
    }
    .accuracy-bar {
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .accuracy-bar > div {
      height: 100%;

      background: linear-gradient(90deg, var(--primary), #06b6d4);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 9px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
    }
    .pill.warn { background: #451a03; color: #fbbf24; }
    .pill.ok { background: #052e16; color: #86efac; }
    .mini {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: flex-start;
    }
    .mini button {
      padding: 8px 12px;
      font-size: 14px;
    }
    .word-menu {

    }
    .word-menu > summary {
